# Cross-school collaborations
collaborations:
  ai_robotics:
    professors: ["ai_ml_professor", "robotics_professor"]
    topics: ["autonomous systems", "computer vision", "reinforcement learning"]
    
  cybersecurity_compliance:
    professors: ["cybersecurity_professor", "regulatory_science_professor"]
    topics: ["security compliance", "data protection", "auditing"]
    
  biomedical_regulatory:
    professors: ["biomedical_professor", "regulatory_science_professor"]
    topics: ["medical device approval", "clinical trials", "FDA compliance"]
    
  devops_cloud:
    professors: ["devops_sre_professor", "cloud_engineering_professor"]
    topics: ["cloud infrastructure", "CI/CD", "scalability"]

# Learning level definitions
levels:
  L1:
    name: "Foundational"
    description: "Basic concepts and terminology"
    bloom_taxonomy: ["Remember", "Understand"]
    
  L2:
    name: "Intermediate"
    description: "Application and analysis"
    bloom_taxonomy: ["Apply", "Analyze"]
    
  L3:
    name: "Advanced"
    description: "Synthesis and evaluation"
    bloom_taxonomy: ["Evaluate", "Create"]
    
  L4:
    name: "Expert"
    description: "Mastery and innovation"
    bloom_taxonomy: ["Create", "Innovate"]
